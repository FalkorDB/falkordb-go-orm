run:
  timeout: 5m
  go: '1.21'

linters:
  enable:
    - gofmt
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
  disable:
    - errcheck
    - misspell
    - unconvert
    - unparam
    - gocyclo
    - gocritic

linters-settings:
  govet:
    enable:
      - shadow
  misspell:
    locale: US

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - unparam
    # Exclude examples from strict checks
    - path: examples/
      linters:
        - errcheck
        - staticcheck
  max-issues-per-linter: 50
  max-same-issues: 3
